<!DOCTYPE html>
<html lang="es">
<head>

            <a href="#" title="Mail">
                <svg viewBox="0 0 24 24" fill="#EA4335"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2v.01L12 12 4 6.01V6h16zM4 18V8.24l7.4 5.55a1 1 0 0 0 1.2 0L20 8.24V18H4z"/></svg>

            </a>
        </div>
    </div>

    <!-- ===== Fila de Estrenos / Trailers: se llena sola buscando .html en las carpetas "Estrenos" y "Trailer" ===== -->
    <section class="featured-row" id="featured-row">
        <p class="loading-msg" id="featured-loading">Buscando estrenos y trailers...</p>
    </section>

    <!-- ===== Banner + grilla principal: se llena sola buscando .html en la carpeta "juegos" ===== -->
    <div class="banner">¡AQUÍ TENEMOS MÁS JUEGOS PARA TI!</div>

    <section class="games-box">
        <div class="games-grid" id="games-grid">
            <p class="loading-msg" id="games-loading">Buscando juegos...</p>
        </div>
    </section>

    <div class="banner">¡AQUÍ TENEMOS MÁS JUEGOS PARA TI!</div>

</div>

<footer>
    Fan project · Los juegos pertenecen a Inkagames/Mazniac
</footer>

<script src="script.js"></script>
</body>
</html>
