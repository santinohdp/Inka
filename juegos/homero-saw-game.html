<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homero Saw Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            padding: 15px 10px;
        }
        a.volver { color: #e94560; text-decoration: none; margin-bottom: 15px; align-self: flex-start; }
        a.volver:hover { text-decoration: underline; }

        .header-box {
            width: 600px;
            max-width: 95vw;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            border: 2px solid #a4d65e;
            background: #fff;
            padding: 12px;
            margin-bottom: 15px;
        }
        .header-photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #6bbf3a;
        }
        .header-text p {
            font-size: 14px;
            color: #222;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .header-text b { color: #d0021b; }

        #container {
            width: 600px;
            height: 400px;
            max-width: 95vw;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        #container ruffle-player {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

<a href="../" class="volver">&larr; Volver al menú</a>

<div class="header-box">
    <img class="header-photo" src="homero-saw-game.jpg" alt="Foto">
    <div class="header-text">
        <p><b>Título:</b> Homero Saw Game</p>
        <p><b>Descripción:</b> La familia de Homero ha sido secuestrada por el malvado muñeco Pigsaw. ¡Ayuda a Homero a encontrar y rescatar a Marge, Bart, Lisa y Maggie!</p>
        <p><b>Nivel:</b> Apto para todos</p>
    </div>
</div>

<div id="container"></div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", () => {
        const player = window.RufflePlayer.newest().createPlayer();
        const container = document.getElementById("container");
        container.appendChild(player);
        player.load({ url: "homero-saw-game.swf", backgroundColor: "#000" });
    });
</script>

</body>
</html>
