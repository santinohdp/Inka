<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fernanfloo Saw Game</title>
    <link rel="icon" type="image/png" href="../favicon-obama.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px 10px;
        }

        .header-box {
            width: 600px;
            max-width: 95vw;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            border: 2px solid #a4d65e;
            padding: 12px;
            margin-bottom: 15px;
        }
        .header-photo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #6bbf3a;
        }
        .header-text p {
            font-size: 14px;
            color: #222;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        .header-text b { color: #d0021b; }

        .flags-row {
            width: 600px;
            max-width: 95vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .flags-left {
            display: flex;
            gap: 10px;
            font-size: 26px;
            line-height: 1;
        }
        .social-icons {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .social-icons a { display: inline-flex; }
        .social-icons svg { width: 24px; height: 24px; }

        #back-link {
            width: 600px;
            max-width: 95vw;
            margin-bottom: 10px;
        }
        #back-link a { color: #e94560; text-decoration: none; }
        #back-link a:hover { text-decoration: underline; }

        #container {
            width: 600px;
            height: 400px;
            max-width: 95vw;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        #container ruffle-player {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <img class="header-photo" src="fernanfloo-saw-game.jpg" alt="Foto">
        <div class="header-text">
            <p><b>Título:</b> Fernanfloo Saw Game</p>
            <p><b>Descripción:</b> El malvado Pigsaw ha secuestrado a Curly para obligar a Fernanfloo a jugar su malévolo juego, ¡ayúdalo antes que sea demasiado tarde!</p>
            <p><b>Nivel:</b> Apto para todos</p>
        </div>
    </div>

    <div class="flags-row">
        <div class="flags-left">
            <span title="Español">🇪🇸</span>
            <span title="English">🇺🇸</span>
            <span title="Português">🇧🇷</span>
            <span title="Français">🇫🇷</span>
            <span title="Deutsch">🇩🇪</span>
            <span title="Русский">🇷🇺</span>
        </div>
        <div class="social-icons">
            <a href="#" title="Facebook">
                <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.23.2 2.23.2v2.45h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12z"/></svg>
            </a>
            <a href="#" title="Mail">
                <svg viewBox="0 0 24 24" fill="#EA4335"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2v.01L12 12 4 6.01V6h16zM4 18V8.24l7.4 5.55a1 1 0 0 0 1.2 0L20 8.24V18H4z"/></svg>
            </a>
            <a href="#" title="Twitter">
                <svg viewBox="0 0 24 24" fill="#1DA1F2"><path d="M22.46 6c-.77.35-1.6.58-2.46.69a4.3 4.3 0 0 0 1.88-2.37 8.59 8.59 0 0 1-2.72 1.04A4.28 4.28 0 0 0 11.7 8.9c0 .34.04.67.11.98A12.14 12.14 0 0 1 3.16 4.9a4.28 4.28 0 0 0 1.32 5.71 4.24 4.24 0 0 1-1.94-.54v.05a4.28 4.28 0 0 0 3.43 4.2 4.3 4.3 0 0 1-1.93.07 4.29 4.29 0 0 0 4 2.98A8.6 8.6 0 0 1 2 19.54a12.13 12.13 0 0 0 6.57 1.93c7.88 0 12.2-6.53 12.2-12.2 0-.19 0-.37-.01-.56A8.72 8.72 0 0 0 22.46 6z"/></svg>
            </a>
        </div>
    </div>

    <div id="back-link">
        <a href="../">&larr; Volver al menú</a>
    </div>

    <div id="container"></div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", () => {
            const player = window.RufflePlayer.newest().createPlayer();
            const container = document.getElementById("container");
            container.appendChild(player);
            player.load({ url: "fernanfloo-saw-game.swf", backgroundColor: "#000" });
            player.style.width = "100%";
            player.style.height = "100%";
        });
    </script>

</body>
</html>
